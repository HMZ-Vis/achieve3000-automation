name: Build Windows app

on:
  workflow_dispatch:
  push:
    paths:
      - "launcher.py"
      - "achieve3000_automation.py"
      - "requirements.txt"
      - "build_windows.ps1"
      - "Achieve3000Launcher.spec"
      - ".github/workflows/build-windows.yml"
      - "achieve3000.ico"
      - "achieve3000.png"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Install Playwright browsers
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}\playwright-browsers
        run: |
          python -m playwright install chromium

      - name: Build automation worker EXE
        run: |
          python -m PyInstaller --noconfirm --clean --onefile `
            --collect-data certifi `
            --name achieve3000_automation achieve3000_automation.py

      - name: Build launcher EXE
        run: |
          python -m PyInstaller --noconfirm --clean --onefile `
            --name Achieve3000Launcher `
            --icon achieve3000.ico `
            --add-data "achieve3000_automation.py;." `
            --hidden-import playwright_stealth `
            --collect-data certifi `
            launcher.py

      - name: Copy automation EXE into dist folder
        run: |
          copy dist\achieve3000_automation.exe dist\achieve3000_automation.exe
          echo "Dist contents:"
          dir dist\

      - name: Copy Playwright browsers into dist
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}\playwright-browsers
        run: |
          if (Test-Path "playwright-browsers") {
            Copy-Item -Recurse -Force playwright-browsers dist\playwright-browsers
            Write-Host "Playwright browsers copied to dist."
          } else {
            Write-Host "No bundled browser directory found — skipping."
          }

      - name: Verify build artifacts
        run: |
          if (-not (Test-Path "dist\Achieve3000Launcher.exe")) {
            Write-Error "Achieve3000Launcher.exe not found!"
            exit 1
          }
          if (-not (Test-Path "dist\achieve3000_automation.exe")) {
            Write-Error "achieve3000_automation.exe not found!"
            exit 1
          }
          Write-Host "All build artifacts verified."

      - name: Package as ZIP
        run: |
          Compress-Archive -Path dist\* -DestinationPath Achieve3000-Windows.zip
          Write-Host "Packaged: Achieve3000-Windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Achieve3000-Windows
          path: Achieve3000-Windows.zip
          retention-days: 30


name: Build Windows app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    paths:
      - "launcher.py"
      - "achieve3000_automation.py"
      - "requirements.txt"
      - ".github/workflows/build-windows.yml"
      - "achieve3000.ico"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}\playwright-browsers

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Install Playwright Chromium
        run: python -m playwright install chromium

      - name: Build automation worker EXE
        run: |
          python -m PyInstaller --noconfirm --clean --onefile `
            --collect-data certifi `
            --hidden-import playwright_stealth `
            --name achieve3000_automation achieve3000_automation.py

      - name: Build launcher EXE
        run: |
          $icon = ""
          if (Test-Path "achieve3000.ico") { $icon = "--icon achieve3000.ico" }
          python -m PyInstaller --noconfirm --clean --onefile `
            --name Achieve3000Launcher `
            --hidden-import playwright_stealth `
            --collect-data certifi `
            $icon `
            launcher.py

      - name: Copy Playwright browsers into dist
        run: |
          if (Test-Path "playwright-browsers") {
            Copy-Item -Recurse -Force playwright-browsers dist\playwright-browsers
            Write-Host "Playwright browsers copied."
          } else {
            Write-Host "No bundled browser directory — skipping."
          }

      - name: Verify build artifacts
        run: |
          if (-not (Test-Path "dist\Achieve3000Launcher.exe")) {
            Write-Error "Achieve3000Launcher.exe not found!"; exit 1
          }
          if (-not (Test-Path "dist\achieve3000_automation.exe")) {
            Write-Error "achieve3000_automation.exe not found!"; exit 1
          }
          Write-Host "All artifacts verified."
          dir dist\

      - name: Package as ZIP
        run: |
          Compress-Archive -Path dist\* -DestinationPath Achieve3000-Windows.zip
          Write-Host "Packaged: Achieve3000-Windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Achieve3000-Windows
          path: Achieve3000-Windows.zip
          retention-days: 7

      - name: Create GitHub Release (Windows)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Achieve3000 Runner ${{ github.ref_name }}"
          body: |
            ## Achieve3000 Runner ${{ github.ref_name }}

            ### Downloads
            | Platform | File |
            |----------|------|
            | 🪟 Windows | `Achieve3000-Windows.zip` |
            | 🍎 macOS | `Achieve3000-macOS.dmg` *(added when macOS build completes)* |

            ### What's new
            - Stealth mode (playwright-stealth) — masks automation fingerprints
            - Chrome 130 user-agent + realistic HTTP headers
            - Groq AI for MCQ answering

            ### How to use (Windows)
            1. Extract the ZIP
            2. Run `Achieve3000Launcher.exe`
            3. Enter Groq API key + credentials → click **Start**
          files: Achieve3000-Windows.zip
          draft: false
          prerelease: false
